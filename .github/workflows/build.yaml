name: Build Garage BLU

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.model }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [ShellyPlus1, Shelly1Gen3]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build firmware
        env:
          MODEL: ${{ matrix.model }}
        run: |
          docker run --rm \
            -e MODEL \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w "$GITHUB_WORKSPACE" \
            ghcr.io/markirb/mos:latest \
            bash -ec 'git config --global --add safe.directory "$PWD"; make "$MODEL" LOCAL=1'
      - name: Upload model firmware
        uses: actions/upload-artifact@v7
        with:
          name: garage-blu-${{ matrix.model }}
          path: build_${{ matrix.model }}/fw.zip
          if-no-files-found: error
          retention-days: 7
