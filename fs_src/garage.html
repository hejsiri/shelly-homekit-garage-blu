aside{grid-template-columns:repeat(2,minmax(0,1fr))}.button-tile{display:flex;align-items:center;justify-content:flex-start;height:60px;min-height:60px;padding:7px 10px;gap:9px;border:1px solid transparent;border-radius:22px;background:rgba(255,255,255,.64);backdrop-filter:blur(6px);color:#30383d;transition:background .15s}.button-tile[hidden]{display:none}.button-tile svg{width:36px;height:36px;flex-shrink:0;fill:none;stroke:var(--muted);stroke-width:1.6}.button-tile strong{display:block;font-size:12px;font-weight:600;line-height:1.2}.button-tile span{display:block;font-size:12px;line-height:1.3;margin-top:3px;color:var(--muted)}html[data-theme="night"] .button-tile{background:#1e1f23a3;color:#eee}.button-tile.pulse,html[data-theme="night"] .button-tile.pulse{background:#fff;color:#202329;border-color:#d9e5de}.button-tile.pulse svg{stroke:#51b89b}.button-tile.pulse span{color:#467b66}

.presence-tile>svg,.button-tile>svg{width:36px;height:32px;flex:0 0 36px;padding:0 6px;stroke:var(--muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;fill:none}.presence-tile strong,.button-tile strong{color:inherit}.presence-tile span{color:var(--muted)}.presence-tile.active,html[data-theme="night"] .presence-tile.active{background:#fff;color:#202329;border:1px solid #e5e5ea}.presence-tile.active span{color:#85858b}.presence-tile.active>svg{stroke:#51b89b}

.tile-icon{display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:transparent;color:var(--muted)}.sensor-tile .tile-icon>svg,.presence-tile .tile-icon>svg,.button-tile .tile-icon>svg{width:24px;height:26px;flex:none;padding:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.presence-tile.active .tile-icon,.sensor-tile.active .tile-icon{background:#4cadd8;color:white}.button-tile.pulse .tile-icon{background:#e86363;color:white}.button-tile.pulse .tile-icon>svg{stroke:white}.sensor-tile.active,html[data-theme="night"] .sensor-tile.active{background:#fff;color:#202329;border:1px solid #e5e5ea}.sensor-tile.active span:not(.tile-icon){color:#85858b}
.presence-tile.active .tile-icon>svg,.sensor-tile.active .tile-icon>svg,.button-tile.pulse .tile-icon>svg{color:#fff;stroke:#fff}
/* Shared icon slot keeps all four tiles aligned, including inactive states. */
aside .home-tile,aside .sensor-tile,aside .presence-tile,aside .button-tile{padding:7px 10px;gap:9px;border-width:1px;border-style:solid}
aside .presence-tile:not(.active){border-color:transparent}
aside .sensor-tile .tile-icon,aside .presence-tile .tile-icon,aside .button-tile .tile-icon,aside .homekit-icon{display:flex;align-items:center;justify-content:center;width:36px;height:36px;flex:0 0 36px;margin:0;padding:0;line-height:1}
aside .tile-icon>svg{display:block;margin:0}
.garage-details .weather-row{min-height:20px;line-height:20px;padding:1px 0;overflow:visible}.garage-details .weather-row svg{display:block;width:13px;height:17px;flex:0 0 13px;overflow:visible}
/* Use the motion tile typography for every dashboard tile and state. */
aside .dashboard-tile{font-family:inherit;font-style:normal;--tile-title-color:var(--ink);--tile-status-color:var(--muted)}
aside .dashboard-tile:is(.active,.pulse){--tile-title-color:#202329;--tile-status-color:#85858b}
aside .dashboard-tile .tile-copy{display:flex;flex-direction:column;min-width:0;gap:0}
aside .dashboard-tile .tile-copy .tile-name{display:block;margin:0;padding:0;font-size:13px;font-weight:600;line-height:1.15;letter-spacing:0;color:var(--tile-title-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
aside .dashboard-tile .tile-copy .tile-status{display:block;margin:2px 0 0;padding:0;font-size:14px;font-weight:400;line-height:1.2;letter-spacing:0;color:var(--tile-status-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
aside .dashboard-tile .tile-copy .door-state{display:flex;align-items:baseline;gap:3px}
.door-state .obstruction-icon{display:none;width:16px;height:16px;flex:0 0 16px;align-self:center;fill:currentColor}
.home-tile.obstructed .obstruction-icon{display:block}
.garage-details .weather-row,.garage-details .detail-row{max-width:100%;min-width:0}
.garage-details .sensor-label{min-width:0;overflow:hidden;text-overflow:ellipsis}
.garage-details .mini-badge,.garage-details svg{flex-shrink:0}
/* Reveal only the complete selected scene, never legacy/default image layers. */
.scene{visibility:hidden}html[data-scene-ready="true"] .scene{visibility:visible}
</style>
<main>
<div class="toolbar"><div class="mode-group" aria-label="Appearance"><button type="button" data-theme-mode="day" aria-label="Day" title="Day"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button><button type="button" data-theme-mode="night" aria-label="Night" title="Night"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg></button><button type="button" data-theme-mode="auto">Auto</button></div><div class="mode-group" aria-label="Car"><button type="button" id="car-toggle" aria-label="Show car" title="Car in the garage"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10 2-6h12l2 6M3 10h18v8H3zM5 18v3m14-3v3M6 14h2m8 0h2"/></svg></button></div></div>

<div class="garage-details" aria-label="Sensor readings"><div id="weather-outdoor" class="weather-row"></div><div id="weather-indoor" class="weather-row"></div></div>
<div class="layout">
<div class="scene" role="img" aria-label="Garage with an animated door">
<div class="house-canvas"><img class="house-background" alt="">
<div class="aperture"><img class="interior" alt=""><div class="car-ground"></div><img class="car-layer" alt=""><div class="leaf" id="leaf"><img alt=""></div></div>
</div></div>
<aside aria-label="Garage door controls">
<button id="garage-control" class="home-tile dashboard-tile" type="button" aria-label="Open garage door">
<span class="homekit-icon" aria-hidden="true"><img class="icon-open" src="garage-icon-open.svg" alt=""><img class="icon-closed" src="garage-icon-closed.svg" alt=""></span>
<span class="tile-copy"><span class="tile-name">Garage door</span>
<strong class="door-state tile-status"><svg class="obstruction-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M10.27 3.5a2 2 0 0 1 3.46 0l8.66 15A2 2 0 0 1 20.66 21H3.34a2 2 0 0 1-1.73-3l8.66-15ZM12 8a1 1 0 0 0-1 1v4a1 1 0 0 0 2 0V9a1 1 0 0 0-1-1Zm0 8a1.25 1.25 0 1 0 0 2.5A1.25 1.25 0 0 0 12 16Z"/></svg><span id="status" aria-live="polite">Closed</span><span id="position" class="position"></span></strong></span>
</button>
<div class="sensor-list" aria-label="Sensors"><div class="sensor-tile dashboard-tile" id="motion-tile" hidden><span class="tile-icon" aria-hidden="true"><svg viewBox="0 0 28 32" aria-hidden="true"><circle cx="16" cy="5" r="2.5"/><path d="m13 11 4-2 3 5 4 1M16 11l-4 8 5 3 2 7M12 19l-4 9M12 12l-3 4M2 8h5M1 14h4M2 21h4"/></svg></span><div class="tile-copy"><strong class="tile-name">Motion sensor</strong><span class="tile-status">—</span></div></div><div class="presence-tile dashboard-tile" id="car-presence" hidden><span class="tile-icon" aria-hidden="true"><svg viewBox="0 0 28 32" aria-hidden="true"><path d="m6 14 2-6a2 2 0 0 1 2-1h8a2 2 0 0 1 2 1l2 6M7 14h14a2 2 0 0 1 2 2v7H5v-7a2 2 0 0 1 2-2Zm0 9v3m14-3v3M8 18h3m6 0h3M11 22h6"/></svg></span><div class="tile-copy"><strong class="tile-name">Car presence</strong><span class="tile-status">—</span></div></div>


</div>

<div class="button-tile dashboard-tile" id="button-indicator" role="status" aria-label="BLU Button1" hidden><span class="tile-icon" aria-hidden="true"><svg viewBox="0 0 28 32" aria-hidden="true"><rect x="6" y="4" width="16" height="24" rx="5"/><circle cx="14" cy="14" r="4.5"/><path d="M12 24h4"/></svg></span><div class="tile-copy"><strong class="tile-name">Button</strong><span class="tile-status">Ready</span></div></div>
</aside>
</div>

</main>
<script>
(()=>{
const system=matchMedia('(prefers-color-scheme: dark)'),base=document.querySelector('.interior'),exterior=document.querySelector('.house-background');let mode='auto',car='car';try{mode=localStorage.getItem('garage-theme')||'auto';car=localStorage.getItem('garage-car')||'car';}catch(_){}if(!['day','night','auto'].includes(mode))mode='auto';if(!['car','empty'].includes(car))car='car';
let themeRequest=0;
let lastPresenceMAC=null,lastPresencePacket=null,lastPresence=null;
// A user override lasts until a new authenticated packet or a presence transition.
// Polling the same packet must not immediately undo the toolbar button.
function syncCarPresence(blu){
 const button=blu.button;
 if(!button||!button.secure){lastPresenceMAC=lastPresencePacket=lastPresence=null;return;}
 const present=typeof blu.car_present==='boolean'?blu.car_present:!!(button.seen&&button.age_s>=0&&button.age_s<=(blu.presence_timeout_s||45));
 const mac=blu.button_mac||'',packet=button.packet_seq;
 if(mac!==lastPresenceMAC||packet!==lastPresencePacket||present!==lastPresence){
   car=present?'car':'empty';apply();
 }
 lastPresenceMAC=mac;lastPresencePacket=packet;lastPresence=present;
}
window.addEventListener('message',e=>{
 if(e.source===parent&&e.origin===location.origin&&e.data&&e.data.garageTelemetry)
   syncCarPresence(e.data.garageTelemetry.status.blu||{});
});
const assetCache=new Map();
function readyAsset(src){
 if(!assetCache.has(src))assetCache.set(src,new Promise((resolve,reject)=>{
   const img=new Image(),fail=()=>{assetCache.delete(src);reject(new Error(src));};
   img.onload=()=>{if(img.decode)img.decode().then(()=>resolve(src),fail);else resolve(src);};
   img.onerror=fail;img.src=src;
 }));
 return assetCache.get(src);
}
async function apply(){const request=++themeRequest,theme=mode==='auto'?(system.matches?'night':'day'):mode;
const paths=[`garage-v16-${theme}.webp`,`garage-v16-interior-${theme}.webp`,`garage-v16-door-${theme}.webp`,`garage-tesla-s-${theme}.webp`];
try{await Promise.all(paths.map(readyAsset));}catch(e){console.warn('Cannot load complete garage theme',e);return;}if(request!==themeRequest)return;
exterior.src=paths[0];base.src=paths[1];document.querySelector('.leaf img').src=paths[2];document.querySelector('.car-layer').src=paths[3];document.documentElement.dataset.car=car;document.querySelector('.car-layer').hidden=car!=='car';document.querySelector('.car-ground').hidden=car!=='car';document.documentElement.dataset.theme=theme;parent.postMessage({garageAction:'theme',theme},location.origin);
document.documentElement.dataset.sceneReady='true';
base.closest('.scene').setAttribute('aria-label',car==='car'?'Garage with a Tesla Model S':'Empty garage');
document.querySelectorAll('[data-theme-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeMode===mode)));document.getElementById('car-toggle').setAttribute('aria-pressed',String(car==='car'));document.getElementById('car-toggle').setAttribute('aria-label',car==='car'?'Hide car':'Show car');}
document.querySelectorAll('[data-theme-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.themeMode;try{localStorage.setItem('garage-theme',mode);}catch(_){}apply();}));document.getElementById('car-toggle').addEventListener('click',()=>{car=car==='car'?'empty':'car';try{localStorage.setItem('garage-car',car);}catch(_){}apply();});system.addEventListener('change',()=>{if(mode==='auto')apply();});
const scene=document.querySelector('.scene'),canvas=document.querySelector('.house-canvas');
function fitScene(){const box=scene.getBoundingClientRect(),scale=Math.max(box.width/1122,box.height/1402);canvas.style.width=(1122*scale)+'px';canvas.style.height=(1402*scale)+'px';canvas.style.left=((box.width-1122*scale)/2)+'px';canvas.style.top=((box.height-1402*scale)/2)+'px';}
new ResizeObserver(fitScene).observe(scene);fitScene();apply();
})();

(()=>{
const leaf=document.getElementById('leaf'),status=document.getElementById('status'),position=document.getElementById('position'),control=document.getElementById('garage-control');
const sensors=document.querySelectorAll('.sensor-tile');let frame=0,received=false,lastUpdate=0,lastButtonSequence=null,buttonPulseTimer=0;
control.disabled=true;status.textContent='Loading…';
control.addEventListener('click',()=>{if(!control.disabled)parent.postMessage({garageAction:'toggle'},location.origin);});
function sensorValue(node,value){node.querySelector(':scope > div > span').textContent=value;}
function update(data){
 received=true;lastUpdate=performance.now();if(frame)cancelAnimationFrame(frame);
 const cd=data.status,blu=cd.blu||{},blocked=blu.enable&&!blu.ready,state=blocked?'unavailable':cd.cur_state_str;
 control.disabled=blocked||!['open','closed','opening','closing','stopped'].includes(state);
 const moving=state==='opening'||state==='closing';
 const captions={closed:'Closed',open:'Open',opening:'Opening…',closing:'Closing…',stopped:'Stopped',unavailable:'No data'};
 control.querySelector('.tile-name').textContent=cd.name||'Garage door';
 const obstructed=!!(cd.obstruction_detected??cd.movement_timed_out)&&!blocked;
 status.textContent=obstructed?'Obstruction':captions[state]||'Unknown state';control.classList.toggle('obstructed',obstructed);control.classList.toggle('active',state!=='closed'&&state!=='unavailable');control.classList.toggle('closed',state==='closed');control.setAttribute('aria-label',moving?'Stop garage door':state==='closed'?'Open garage door':'Close garage door');
 const motion=data.motion||{from:.5,to:.5,duration:0,elapsed:0},start=performance.now();
 function paint(now){
  const age=Math.max(0,now-start)+motion.elapsed;
  const f=motion.duration>0?Math.min(1,age/motion.duration):1;
  let p=Math.max(0,Math.min(1,motion.from+(motion.to-motion.from)*f));
  if(obstructed)p=.5;
  else {if(state==='opening')p=Math.min(.96,p);if(state==='closing')p=Math.max(.04,p);}
  leaf.style.transform=`translateY(${-100*p}%)`;control.style.setProperty('--door-open',p);leaf.closest('.scene').style.setProperty('--openness',p);
  position.textContent=obstructed||moving||state==='stopped'?`${Math.round(p*100)}%`:'';
  if(!obstructed&&moving&&f<1)frame=requestAnimationFrame(paint);
 }
 paint(start);
 const fresh=s=>s&&s.secure&&s.seen&&s.age_s>=0&&s.age_s<=blu.stale_after_s;
 sensors[0].querySelector('.tile-name').textContent=blu.motion&&blu.motion.name||'Motion sensor';
 sensors[0].hidden=!(blu.motion&&blu.motion.secure);sensors[0].classList.toggle('active',!!(fresh(blu.motion)&&blu.motion.active));sensorValue(sensors[0],fresh(blu.motion)?(blu.motion.active?'Motion detected':'No motion'):'No data');


 const tempIcon='<svg viewBox="-1 -1 18 24" aria-hidden="true"><path d="M5 12V4a3 3 0 0 1 6 0v8a5 5 0 1 1-6 0Z"/><path d="M8 6v10"/></svg>';
 const waterIcon='<svg viewBox="-1 -1 18 23" aria-hidden="true"><path d="M8 1S1 10 1 13a7 7 0 0 0 14 0C15 10 8 1 8 1Z"/></svg>';
 for(const [role,label] of [['outdoor','Outdoor'],['indoor','Indoor']]){
   const v=blu[role],node=document.getElementById('weather-'+role);node.hidden=!(v&&v.secure);
   node.innerHTML='<span class="sensor-label"></span> '+tempIcon+(fresh(v)?Number(v.temperature).toFixed(1)+' °C':'—')+' '+waterIcon+(fresh(v)?Number(v.humidity)+'%':'—');
   node.querySelector('.sensor-label').textContent=(v&&v.name||label)+':';
 }
 const indicator=document.getElementById('button-indicator');indicator.hidden=!(blu.button&&blu.button.secure);
 const seq=Number(blu.button_press_seq)||0,pressAge=Number(blu.button_press_age_ms);
 if(lastButtonSequence!==null&&seq!==lastButtonSequence&&seq>0&&pressAge>=0&&pressAge<=2500&&!indicator.hidden){
   indicator.classList.add('pulse');indicator.querySelector(':scope > div > span').textContent='Pressed';
   clearTimeout(buttonPulseTimer);buttonPulseTimer=setTimeout(()=>{indicator.classList.remove('pulse');indicator.querySelector(':scope > div > span').textContent='Ready';},1000);
 }
 lastButtonSequence=seq;
 indicator.querySelector('.tile-name').textContent=blu.button&&blu.button.name||'Button';
 const button=blu.button,presence=document.getElementById('car-presence');presence.hidden=!(button&&button.secure);
 const present=typeof blu.car_present==='boolean'?blu.car_present:button&&button.secure&&button.seen&&button.age_s>=0&&button.age_s<=(blu.presence_timeout_s||45);
 presence.querySelector(':scope > div > span').textContent=blu.car_presence_ready===false?'No data':present?'Detected':'Not detected';presence.classList.toggle('active',!!present);
 presence.querySelector('.tile-name').textContent=blu.car_name||'Car presence';
 presence.title='BLU button detected within range — this does not confirm the parking location';

}
window.addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data&&e.data.garageTelemetry)update(e.data.garageTelemetry);});
// A disconnected panel must not continue presenting old readings as live.
setInterval(()=>{if(received&&performance.now()-lastUpdate>15000){control.disabled=true;status.textContent='Disconnected';control.classList.remove('obstructed');if(frame)cancelAnimationFrame(frame);sensors.forEach(s=>sensorValue(s,'No data'));}},3000);
parent.postMessage({garageAction:'ready'},location.origin);
})();
</script>
</html>
