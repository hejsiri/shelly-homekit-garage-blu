<script>
const garageReadingBadgeCache=new WeakMap();
function layoutGarageReadings(){
 document.querySelectorAll('.garage-details').forEach(group=>{
   const visible=Array.from(group.children).filter(node=>node.classList.contains('home-summary')&&!node.hidden);
   group.hidden=visible.length===0;
   visible.forEach(node=>{node.style.gridColumn='span 2';});
   if(visible.length%3===1)visible[visible.length-1].style.gridColumn='3 / span 2';
   else if(visible.length%3===2){visible[visible.length-2].style.gridColumn='2 / span 2';visible[visible.length-1].style.gridColumn='4 / span 2';}
 });
}
function setGarageDashboardVisibility(blu){
 const show=role=>!blu[role]||blu[role].dashboard!==false;
 const visibility={temperature:show('indoor')||show('outdoor'),humidity:show('indoor')||show('outdoor'),light:show('motion'),motion:show('motion'),open:show('open'),closed:show('closed'),smoke:show('smoke')};
 for(const [kind,visible] of Object.entries(visibility))document.querySelector('[data-reading="'+kind+'"]').closest('.home-summary').hidden=!visible;
}
const garageReadingUpdates=new WeakMap();
let garageReadingBadgeSequence=0,garageReadingBadgeCanvas=null;
function setGarageReadingValue(node,text,detected=false,refreshKey=null){
 const key=refreshKey===null?null:JSON.stringify(refreshKey);

 if(!update){update={key,until:0,timer:0};garageReadingUpdates.set(node,update);}
 else if(key!==null&&key!==update.key&&!detected){
   update.until=performance.now()+1000;
   if(update.timer)clearTimeout(update.timer);
   update.timer=setTimeout(()=>{update.timer=0;update.until=0;setGarageReadingValue(node,update.text,update.detected,update.refreshKey);},1000);
 }
 update.key=key;update.text=text;update.detected=detected;update.refreshKey=refreshKey;
 if(key===null||detected){if(update.timer)clearTimeout(update.timer);update.timer=0;update.until=0;}
 const badge=detected||update.until>performance.now();
 node.setAttribute('data-i18n-ignore','');
 const style=badge?getComputedStyle(node):null;
 const fontSize=style?parseFloat(style.fontSize):0;
 const fontFamily=style?style.fontFamily:'';
 const lineHeight=style?(parseFloat(style.lineHeight)||fontSize*1.2):0;
 const signature=JSON.stringify([text,badge,fontSize,fontFamily,lineHeight]);
 if(garageReadingBadgeCache.get(node)===signature)return;
 garageReadingBadgeCache.set(node,signature);
 node.classList.toggle('is-detected',badge);
 node.textContent=text;
 if(!badge)return;
 if(!garageReadingBadgeCanvas)garageReadingBadgeCanvas=document.createElement('canvas');
 const context=garageReadingBadgeCanvas.getContext('2d');
 context.font='600 '+fontSize+'px '+fontFamily;
 const width=Math.ceil(context.measureText(text).width)+8,height=lineHeight;
 const svgNS='http://www.w3.org/2000/svg';
 const create=(tag,attributes)=>{const element=document.createElementNS(svgNS,tag);for(const [key,value] of Object.entries(attributes))element.setAttribute(key,String(value));return element;};
 const id='garage-detected-'+(++garageReadingBadgeSequence);
 const svg=create('svg',{class:'reading-detected-badge',width,height,viewBox:'0 0 '+width+' '+height,'aria-hidden':'true',focusable:'false'});
 const defs=create('defs',{}),mask=create('mask',{id,x:0,y:0,width,height,maskUnits:'userSpaceOnUse',maskContentUnits:'userSpaceOnUse',style:'mask-type:luminance'});
 mask.append(create('rect',{width,height,rx:4,fill:'white'}));
 const cutout=create('text',{x:width/2,y:height/2+fontSize*.32,'text-anchor':'middle','font-family':fontFamily,'font-size':fontSize,'font-weight':600,fill:'black'});
 cutout.textContent=text;mask.append(cutout);defs.append(mask);svg.append(defs,create('rect',{width,height,rx:4,fill:'currentColor',mask:'url(#'+id+')'}));
 const caption=document.createElement('span');caption.className='reading-accessible-text';caption.textContent=text;
 node.replaceChildren(caption,svg);
}
(()=>{
const system=matchMedia('(prefers-color-scheme: dark)'),base=document.querySelector('.interior'),exterior=document.querySelector('.house-background');let mode='auto',car='car';try{mode=localStorage.getItem('garage-theme')||'auto';car=localStorage.getItem('garage-car')||'car';}catch(_){}if(!['day','night','auto'].includes(mode))mode='auto';if(!['car','empty'].includes(car))car='car';
let themeRequest=0;
let lastPresenceMAC=null,lastPresencePacket=null,lastPresence=null;
let presenceData=null,presenceUpdateAt=0;
function renderCarPresence(){
 if(!presenceData)return;
 const presence=document.getElementById('car-presence'),button=presenceData.button;
 const tr=text=>typeof GarageI18n==='undefined'?text:GarageI18n.t(text);
 presence.hidden=!(button&&button.secure)||button.dashboard===false;
 const ready=presenceData.car_presence_ready!==false&&performance.now()-presenceUpdateAt<=15000,present=car==='car';
 setGarageReadingValue(presence.querySelector('[data-reading="car"]'),tr(!ready?'No data':present?'Detected':'Not detected'),ready&&present,ready&&button&&button.secure?[button.packet_seq??null,present]:null);
 presence.classList.toggle('active',ready&&present);
 presence.querySelector('.home-summary-label').textContent=presenceData.car_name||tr('Car presence');
 presence.title=tr('BLU button detected within range — this does not confirm the parking location');
 layoutGarageReadings();
}
document.addEventListener('garage-language-change',renderCarPresence);
// A user override lasts until a new authenticated packet or a presence transition.
// Polling the same packet must not immediately undo the presence control.
function syncCarPresence(blu){
 const button=blu.button;
 if(!button||!button.secure){lastPresenceMAC=lastPresencePacket=lastPresence=null;return;}
 const present=typeof blu.car_present==='boolean'?blu.car_present:!!(button.seen&&button.age_s>=0&&button.age_s<=(blu.presence_timeout_s||45));
 const mac=blu.button_mac||'',packet=button.packet_seq;
 if(mac!==lastPresenceMAC||packet!==lastPresencePacket||present!==lastPresence){
   car=present?'car':'empty';apply();
 }
 lastPresenceMAC=mac;lastPresencePacket=packet;lastPresence=present;
}
window.addEventListener('message',e=>{
 if(e.source===parent&&e.origin===location.origin&&e.data&&e.data.garageTelemetry){
   presenceData=e.data.garageTelemetry.status.blu||{};
   presenceUpdateAt=performance.now();
   syncCarPresence(presenceData);renderCarPresence();
 }
});
const assetCache=new Map();
function readyAsset(src){
 if(!assetCache.has(src))assetCache.set(src,new Promise((resolve,reject)=>{
   const img=new Image(),fail=()=>{assetCache.delete(src);reject(new Error(src));};
   img.onload=()=>{if(img.decode)img.decode().then(()=>resolve(src),fail);else resolve(src);};
   img.onerror=fail;img.src=src;
 }));
 return assetCache.get(src);
}
async function apply(){renderCarPresence();const request=++themeRequest,theme=mode==='auto'?(system.matches?'night':'day'):mode;
const paths=[`garage-v16-${theme}.webp`,`garage-v16-interior-${theme}.webp`,`garage-v16-door-${theme}.webp`,`garage-tesla-s-${theme}.webp`];
try{await Promise.all(paths.map(readyAsset));}catch(e){console.warn('Cannot load complete garage theme',e);return;}if(request!==themeRequest)return;
exterior.src=paths[0];base.src=paths[1];document.querySelector('.leaf img').src=paths[2];document.querySelector('.car-layer').src=paths[3];document.documentElement.dataset.car=car;document.querySelector('.car-layer').hidden=car!=='car';document.querySelector('.car-ground').hidden=car!=='car';document.documentElement.dataset.theme=theme;parent.postMessage({garageAction:'theme',theme},location.origin);
document.documentElement.dataset.sceneReady='true';
base.closest('.scene').setAttribute('aria-label',car==='car'?'Garage with a Tesla Model S':'Empty garage');
document.querySelectorAll('[data-theme-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeMode===mode)));document.getElementById('car-presence').setAttribute('aria-pressed',String(car==='car'));document.getElementById('car-presence').setAttribute('aria-label',car==='car'?'Hide car':'Show car');}
document.querySelectorAll('[data-theme-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.themeMode;try{localStorage.setItem('garage-theme',mode);}catch(_){}apply();}));document.getElementById('car-presence').addEventListener('click',()=>{car=car==='car'?'empty':'car';try{localStorage.setItem('garage-car',car);}catch(_){}apply();renderCarPresence();});system.addEventListener('change',()=>{if(mode==='auto')apply();});
const scene=document.querySelector('.scene'),canvas=document.querySelector('.house-canvas');
function fitScene(){const box=scene.getBoundingClientRect(),scale=Math.max(box.width/1122,box.height/1402);canvas.style.width=(1122*scale)+'px';canvas.style.height=(1402*scale)+'px';canvas.style.left=((box.width-1122*scale)/2)+'px';canvas.style.top=((box.height-1402*scale)/2)+'px';}
new ResizeObserver(fitScene).observe(scene);fitScene();apply();
})();

(()=>{
const leaf=document.getElementById('leaf'),status=document.getElementById('status'),position=document.getElementById('position'),control=document.getElementById('garage-control');
let frame=0,received=false,lastUpdate=0,lastButtonSequence=null,buttonPulseTimer=0;
control.disabled=true;status.textContent='Loading…';
control.addEventListener('click',()=>{if(!control.disabled)parent.postMessage({garageAction:'toggle'},location.origin);});
let summaryData=null;
function renderGarageName(cd){
 const name=cd.name||'Garage door';
 control.querySelector('.tile-name').textContent=['Garage door','Garage Door'].includes(name)&&typeof GarageI18n!=='undefined'?GarageI18n.t('Garage door'):name;
}
function renderSensorNames(blu){
 const tr=text=>typeof GarageI18n==='undefined'?text:GarageI18n.t(text);
 for(const [id,role,fallback] of [['button-indicator','button','Button']]){
   const name=blu[role]&&blu[role].name;
   document.getElementById(id).querySelector('.tile-name').textContent=name&&name!==fallback?name:tr(fallback);
 }
}
function renderSummary(data){
 const cd=data.status,blu=cd.blu||{},tr=text=>typeof GarageI18n==='undefined'?text:GarageI18n.t(text);
 setGarageDashboardVisibility(blu);
 const language=typeof GarageI18n==='undefined'?'en':GarageI18n.getLanguage();
 const number=(value,digits=0)=>value.toFixed(digits).replace('.',language==='pl'?',':'.');
 const paired=s=>!!(s&&(s.paired??s.secure));
 const fresh=s=>paired(s)&&s.ready!==false&&s.seen&&Number.isFinite(s.age_s)&&s.age_s>=0&&s.age_s<=(s.timeout_s||blu.stale_after_s||180);
 const set=(kind,text,detected=false,refreshKey=null)=>setGarageReadingValue(document.querySelector('[data-reading="'+kind+'"]'),text,detected,refreshKey);
 for(const [kind,label] of [['temperature','Temperature'],['humidity','Humidity'],['open','Opening sensor'],['closed','Closing sensor'],['motion','Motion'],['light','Light'],['smoke','Smoke sensor']]){
   const node=document.querySelector('[data-reading="'+kind+'"]').previousElementSibling;
   node.setAttribute('data-i18n-ignore','');node.textContent=tr(label);
 }
 for(const [kind,unit,digits] of [['temperature','°',1],['humidity','%',0]]){
   const sources=['indoor','outdoor'].map(role=>blu[role]).filter(s=>paired(s)&&s.dashboard!==false&&Number.isFinite(s[kind])&&(kind!=='humidity'||s[kind]>=0&&s[kind]<=100)&&(s[kind+'_ready']===true||s[kind+'_ready']!==false&&fresh(s)));
   const values=sources.map(s=>s[kind]);
   const low=Math.min(...values),high=Math.max(...values);
   set(kind,values.length?(number(low,digits)+(low!==high?'–'+number(high,digits):'')+unit):tr('No data'));
   document.getElementById('summary-'+kind).title=sources.map(s=>(s.name||tr('Temperature and humidity'))+': '+number(s[kind],digits)+unit).join(' · ');
 }
 for(const [role,label] of [['open','Opening sensor'],['closed','Closing sensor']]){
   const contact=blu[role];
   set(role,tr(fresh(contact)?contact.active?'Contacts closed':'Contacts open':'No data'),!!(fresh(contact)&&contact.active),fresh(contact)?[contact.packet_seq??null,contact.active]:null);
   document.getElementById('summary-'+role).title=contact&&contact.name&&contact.name!==label?contact.name:tr(label);
 }
 set('motion',tr(fresh(blu.motion)?blu.motion.active?'Detected':'Not detected':'No data'),!!(fresh(blu.motion)&&blu.motion.active),fresh(blu.motion)?[blu.motion.packet_seq??null,blu.motion.active]:null);
 const light=blu.motion;
 const lightFresh=paired(light)&&Number.isFinite(light.illuminance)&&light.illuminance>=0&&(light.illuminance_ready===true||light.illuminance_ready!==false&&fresh(light)&&Number.isFinite(light.illuminance_age_s)&&light.illuminance_age_s>=0&&light.illuminance_age_s<=(light.timeout_s||blu.stale_after_s||180));
 set('light',lightFresh?number(light.illuminance)+' '+(language==='pl'?'luksów':'lux'):tr('No data'),false,lightFresh?[light.packet_seq??null,light.illuminance]:null);
 const smoke=blu.smoke,smokeState=paired(smoke)&&smoke.smoke_seen;
 const smokeFresh=smokeState&&fresh(smoke)&&Number.isFinite(smoke.smoke_age_s)&&smoke.smoke_age_s>=0&&smoke.smoke_age_s<=(smoke.timeout_s||blu.stale_after_s||180);
 set('smoke',tr(smokeState&&smoke.active?'Smoke detected':smokeFresh||fresh(smoke)?'Ready':'No data'),!!(smokeState&&smoke.active),smokeFresh?[smoke.packet_seq??null,smoke.active]:null);

}
document.addEventListener('garage-language-change',()=>{if(summaryData){renderSummary(summaryData);renderGarageName(summaryData.status);renderSensorNames(summaryData.status.blu||{});}});
function renderConnections(network){
 const group=document.getElementById('connection-icons'),wifi=document.getElementById('wifi-indicator'),bt=document.getElementById('bt-indicator');
 const tr=text=>typeof GarageI18n==='undefined'?text:GarageI18n.t(text);
 group.hidden=false;
 const connected=!!(network&&network.wifi_connected),rssi=network&&network.wifi_rssi;
 const valid=Number.isFinite(rssi)&&rssi<0;
 const strength=connected?(valid?(rssi>=-55?4:rssi>=-67?3:rssi>=-75?2:1):0):0;
 const arcs=wifi.querySelectorAll('.wifi-arc');
 arcs.forEach((arc,index)=>arc.classList.toggle('active',index>=4-strength));
 wifi.classList.toggle('offline',!connected);
 const label='Wi-Fi: '+tr(connected?'Connected':'Disconnected')+(connected&&valid?' · '+rssi+' dBm':'');
 wifi.title=label;wifi.setAttribute('aria-label',label);
 bt.hidden=!(network&&network.bt_enabled);
 bt.classList.toggle('starting',!network||!network.bt_running);
 const btLabel=tr(network&&network.bt_running?'Bluetooth enabled':'Bluetooth starting');
 bt.title=btLabel;bt.setAttribute('aria-label',btLabel);
}
function update(data){
 summaryData=data;renderSummary(data);
 renderConnections(data.network);
 received=true;lastUpdate=performance.now();if(frame)cancelAnimationFrame(frame);
 const cd=data.status,blu=cd.blu||{},blocked=blu.enable&&!blu.ready,state=blocked?'unavailable':cd.cur_state_str;
 renderGarageName(cd);
 control.disabled=blocked||!['open','closed','opening','closing','stopped'].includes(state);
 const moving=state==='opening'||state==='closing';
 const captions={closed:'Closed',open:'Open',opening:'Opening…',closing:'Closing…',stopped:'Stopped',unavailable:'No data'};
 const obstructed=!!(cd.obstruction_detected??cd.movement_timed_out)&&!blocked;
 status.textContent=obstructed?'Obstruction':captions[state]||'Unknown state';control.classList.toggle('obstructed',obstructed);control.classList.toggle('active',state!=='closed'&&state!=='unavailable');control.classList.toggle('closed',state==='closed');control.setAttribute('aria-label',moving?'Stop garage door':state==='closed'?'Open garage door':'Close garage door');
 const motion=data.motion||{from:.5,to:.5,duration:0,elapsed:0},start=performance.now();

  const age=Math.max(0,now-start)+motion.elapsed;
  const f=motion.duration>0?Math.min(1,age/motion.duration):1;
  let p=Math.max(0,Math.min(1,motion.from+(motion.to-motion.from)*f));
  if(obstructed)p=.5;
  else {if(state==='opening')p=Math.min(.96,p);if(state==='closing')p=Math.max(.04,p);}
  leaf.style.transform=`translateY(${-100*p}%)`;control.style.setProperty('--door-open',p);leaf.closest('.scene').style.setProperty('--openness',p);
  position.textContent=obstructed||moving||state==='stopped'?`${Math.round(p*100)}%`:'';
  if(!obstructed&&moving&&f<1)frame=requestAnimationFrame(paint);
 }
 paint(start);
 renderSensorNames(blu);


 const indicator=document.getElementById('button-indicator');indicator.hidden=!(blu.button&&blu.button.secure)||blu.button.dashboard===false;
 const seq=Number(blu.button_press_seq)||0,pressAge=Number(blu.button_press_age_ms);
 if(lastButtonSequence!==null&&seq!==lastButtonSequence&&seq>0&&pressAge>=0&&pressAge<=2500&&!indicator.hidden){
   indicator.classList.add('pulse');indicator.querySelector(':scope > div > span').textContent='Pressed';
   clearTimeout(buttonPulseTimer);buttonPulseTimer=setTimeout(()=>{indicator.classList.remove('pulse');indicator.querySelector(':scope > div > span').textContent='Ready';},1000);
 }
 lastButtonSequence=seq;

}
window.addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data&&e.data.garageTelemetry)update(e.data.garageTelemetry);});
// A disconnected panel must not continue presenting old readings as live.
setInterval(()=>{if(received&&performance.now()-lastUpdate>15000){control.disabled=true;status.textContent='Disconnected';renderConnections(null);control.classList.remove('obstructed');if(frame)cancelAnimationFrame(frame);summaryData=null;document.querySelectorAll('[data-reading]').forEach(node=>{setGarageReadingValue(node,typeof GarageI18n==='undefined'?'Disconnected':GarageI18n.t('Disconnected'));});}},3000);
parent.postMessage({garageAction:'ready'},location.origin);
})();
</script>
